unbindall;
bind "`" "toggleconsole";
bind		"a"		"+left";
bind		"d"		"+right";
bind		"s"		"+back";
bind		"w"		"+forward";
bind		"ESCAPE"		"cancelselect";
bind		"TAB"		"+showscores";
bind "X_AXIS" "rightleft"; 
bind "Y_AXIS" "!forwardback"; 
bind "MOUSE_X" "yaw"; 
bind "MOUSE_Y" "pitch"; 
bind "U_AXIS" "yaw"; 
bind "R_AXIS" "pitch"

bind 1 slot1;
bind 2 slot2;
bind 3 slot3;
bind 4 slot4;
bind 5 slot5;
bind 6 slot6;
bind 7 slot7;
bind 8 slot8;
bind 9 slot9;
bind 0 slot10;
bind "-" slot11;
bind "=" slot12;

alias +bindspec "bind q spec_player 2;bind w spec_player 3;bind e spec_player 4;bind r spec_player 5;bind t spec_player 6;bind y spec_player 7;bind u spec_player 8;bind i spec_player 9;bind o spec_player 10;bind p spec_player 11;bind "[" spec_player 12;";
alias -bindspec "unbind "q";bind "w" "+forward";unbind "e";bind "r" "demo_timescale 0.03"; bind "t" "demo_timescale 0.2";bind "y" "demo_timescale 1";bind "u" "demo_timescale 2";bind "i" "demo_timescale 8";bind "o" "demo_timescale 60"; bind p demo_gototick 0";

bind "shift" "+bindspec;demoui";
bind "ALT" demo_pause;
bind "x" demo_togglepause;
bind "SPACE" +jump;
bind "z" slot12;
bind "p" demo_gototick 0;

bind "r" demo_timescale 0.03;
bind "t" demo_timescale 0.2;
bind "y" demo_timescale 1;
bind "u" demo_timescale 2;
bind "i" demo_timescale 8;
bind "o" demo_timescale 60;
