// cs go binds for teleporting bot in player's spot copying player's view angle and crouch state
sv_cheats 1;

bot_stop 1;

mp_solid_teammates 1;

script {pos_player<-null,pl_player<-null,pl_bot<-null}

script {pl_player<-Entities.FindByClassname(null,"player")}

script function addbot(){{pl_bot<-Entities.FindByClassname(null,"cs_bot")}}

script function rem(){pos_player=pl_player.GetOrigin()}

script function tp_bot(){{pl_bot.SetOrigin(pos_player)}}

alias "bot_rotate" "bot_mimic_yaw_offset 0; bot_mimic 1"

alias "adt" "script addbot(); bot_rotate"

alias "rem" "script rem(); adt"

alias "tp_bot" "script tp_bot(); bot_mimic 2";

alias "+tp_bot_to_me" "rem"

alias "-tp_bot_to_me" "tp_bot"

bind "Alt" "+tp_bot_to_me" // change key // literally tp bot to ur spot

script function tp_player() {{pl_player.SetOrigin(pos_player)}{pl_player.SetAngles(ang_player.x,ang_player.y,0)}}

alias "tp_player" "script tp_player()"

bind "-" rem //Запомнить точку; // change key // remember spot for player

bind "[" tp_player //Телепортироваться к точке; // change key // tp to last remembered spot

bind "]" "tp_bot"; // change key // tp bot to latest position
